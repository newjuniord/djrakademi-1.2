<!doctype html>
<html lang="ht" data-theme="djrakademi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#09090b" />
		<meta name="application-name" content="DJR Akademi" />
		<link rel="icon" type="image/png" href="/logo.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// Retire l ancien service worker PWA et ses caches chez les visiteurs existants.
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function () {
					navigator.serviceWorker.getRegistrations().then(function (registrations) {
						registrations.forEach(function (registration) { registration.unregister(); });
					});
				});
			}
			if ('caches' in window) {
				caches.keys().then(function (keys) {
					keys.filter(function (key) { return key.startsWith('djrakademi-'); }).forEach(function (key) { caches.delete(key); });
				});
			}
		</script>
	</body>
</html>
